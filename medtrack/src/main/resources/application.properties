server.port=9090
spring.application.name=medtrack

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/medtrack?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Actuator exposure and info
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
info.app.name=MedTrack
info.app.description=Kisisel saglik takip sistemi
info.app.version=0.0.1

# JDBC driver (açıkça belirtmek baglanti tani sorunlarini azaltir)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
